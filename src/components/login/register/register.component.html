<div class="login-container">
    <div class="login-card">
        <div class="card-header">
            <h2>Crear Cuenta</h2>
            <p>Únete a Evaluador Docente</p>
        </div>
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="name">Nombre Completo</label>
                <input type="text" id="name" formControlName="name" placeholder="Tu nombre" required>
            </div>
            <div class="form-group">
                <label for="username">Nombre de Usuario</label>
                <input type="text" id="username" formControlName="username" placeholder="Tu usuario" required>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" formControlName="email" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" formControlName="password" placeholder="Tu contraseña" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirmar Contraseña</label>
                <input type="password" id="confirm-password" formControlName="confirmPassword"
                    placeholder="Repite tu contraseña" required>
            </div>
            <button type="submit" class="cta-button full-width" [disabled]="registerForm.invalid">Registrarse</button>
        </form>
        <div class="card-footer">
            <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia Sesión</a></p>
        </div>
    </div>
</div>
