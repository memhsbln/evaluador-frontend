<div class="login-container">
    <div class="login-card">
        <div class="card-header">
            <h2>Iniciar Sesión</h2>
            <p>Bienvenido de nuevo</p>
        </div>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="username">Usuario o Correo</label>
                <input type="text" id="username" formControlName="username" placeholder="Nombre de usuario o correo"
                    required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" formControlName="password" placeholder="Tu contraseña" required>
            </div>
            <button type="submit" class="cta-button full-width">Iniciar Sesión</button>
        </form>
        <div class="card-footer">
            <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
        </div>
    </div>
</div>
